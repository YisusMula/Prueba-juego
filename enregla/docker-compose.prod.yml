# Despliegue de producción de ejemplo: app + PostgreSQL + Caddy (TLS automático con Let's Encrypt).
# Uso (desde enregla/):
#   cp server/.env.example server/.env    # NODE_ENV=production, APP_URL=https://TU_DOMINIO, SMTP_*, MAIL_FROM,
#                                         # POSTGRES_PASSWORD larga, DOMAIN=TU_DOMINIO, ACME_EMAIL=tu@email
#   docker compose -f docker-compose.prod.yml --env-file server/.env up -d --build
# Guía completa (primer despliegue, copias, restauración, actualización): docs/OPERACIONES.md
# Requisitos: el DNS de DOMAIN apunta a este servidor y los puertos 80/443 están abiertos.
# La app NO publica ningún puerto: solo Caddy es accesible desde fuera.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enregla
      POSTGRES_USER: enregla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en server/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enregla -d enregla"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: .
      # Datos de la web (VITE_*): el build falla si faltan los legales obligatorios (web/.env.example).
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_LEGAL_OWNER_NAME: ${VITE_LEGAL_OWNER_NAME:-}
        VITE_LEGAL_TAX_ID: ${VITE_LEGAL_TAX_ID:-}
        VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
        VITE_LEGAL_HOSTING_PROVIDER: ${VITE_LEGAL_HOSTING_PROVIDER:-}
        VITE_LEGAL_LAST_UPDATED: ${VITE_LEGAL_LAST_UPDATED:-}
        VITE_LEGAL_REGISTRY_DATA: ${VITE_LEGAL_REGISTRY_DATA:-}
        VITE_LEGAL_HOSTING_LOCATION: ${VITE_LEGAL_HOSTING_LOCATION:-}
        VITE_LEGAL_EMAIL_PROVIDER: ${VITE_LEGAL_EMAIL_PROVIDER:-}
        VITE_LEGAL_JURISDICTION: ${VITE_LEGAL_JURISDICTION:-}
        VITE_ALLOW_PLACEHOLDER_LEGAL: ${VITE_ALLOW_PLACEHOLDER_LEGAL:-}
    restart: unless-stopped
    env_file: server/.env
    environment:
      # Siempre production (aunque server/.env diga development): la imagen no trae pino-pretty.
      NODE_ENV: production
      # Conexión por variables separadas: la contraseña NO va dentro de una URL (no hace falta
      # codificar caracteres como @ : / #). DATABASE_URL vacío anula el que haya en server/.env.
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGUSER: enregla
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: enregla
      HOST: 0.0.0.0
      PORT: 3000
      # Solo se confía en el proxy de la red interna `edge` (Caddy). Nunca TRUST_PROXY=true.
      TRUST_PROXY: 172.30.0.0/24
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    # Límite de memoria recomendado (docs/OPERACIONES.md, «Memoria del contenedor»): proceso
    # principal (~250 MB) + hasta PDF_MAX_CONCURRENCY (2) workers de PDF con el heap acotado a
    # 256 MB cada uno + búferes de los PDF. Con más PDF simultáneos, súbelo ~350 MB por cada uno.
    mem_limit: 1g
    networks: [internal, edge]

  # Copias de seguridad diarias con pg_dump (deploy/backup.sh), retención local de
  # BACKUP_RETENTION_DAYS días en ./backups. Una copia que solo está en este servidor NO protege
  # de perder el servidor: define BACKUP_POST_HOOK para enviarla fuera (docs/OPERACIONES.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: enregla
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: enregla
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_POST_HOOK: ${BACKUP_POST_HOOK:-}
      # Hora (UTC) de la copia diaria.
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/enregla-backup.sh:ro
      - ./backups:/backups
    # Bucle simple (sin cron en la imagen): una copia al día a BACKUP_HOUR_UTC.
    entrypoint: ["/bin/sh", "-c", "while true; do if [ \"$$(date -u +%H)\" -eq \"$${BACKUP_HOUR_UTC}\" ] && [ \"$$(date -u +%F)\" != \"$$(cat /backups/.last 2>/dev/null)\" ]; then sh /usr/local/bin/enregla-backup.sh && date -u +%F > /backups/.last; fi; sleep 300; done"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN (p. ej. app.tudominio.es) en server/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en server/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [edge]

networks:
  internal:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Uso (desde enregla/):
#   cp server/.env.example server/.env   # y edítalo (NODE_ENV=production, APP_URL https, SMTP, etc.)
#   docker compose --env-file server/.env up -d --build
# Las migraciones las aplica el servicio `migrate` (rol propietario) antes de arrancar la app, que
# usa un rol sin permisos para modificar ni borrar registros. Datos de PostgreSQL en el volumen `pgdata`.
# Antes del primer arranque: sh deploy/generate-db-secrets.sh (crea deploy/secrets/db.env y app-db.env).
# server/.env NO lleva claves de la base de datos (la app no debe recibirlas).
x-app-build: &app-build
  context: .
  # Datos de la web (VITE_*): el build falla si faltan los legales obligatorios (web/.env.example).
  args:
    VITE_APP_NAME: ${VITE_APP_NAME:-}
    VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-}
    VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
    VITE_LEGAL_OWNER_NAME: ${VITE_LEGAL_OWNER_NAME:-}
    VITE_LEGAL_TAX_ID: ${VITE_LEGAL_TAX_ID:-}
    VITE_LEGAL_ADDRESS: ${VITE_LEGAL_ADDRESS:-}
    VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
    VITE_LEGAL_HOSTING_PROVIDER: ${VITE_LEGAL_HOSTING_PROVIDER:-}
    VITE_LEGAL_LAST_UPDATED: ${VITE_LEGAL_LAST_UPDATED:-}
    VITE_LEGAL_REGISTRY_DATA: ${VITE_LEGAL_REGISTRY_DATA:-}
    VITE_LEGAL_HOSTING_LOCATION: ${VITE_LEGAL_HOSTING_LOCATION:-}
    VITE_LEGAL_EMAIL_PROVIDER: ${VITE_LEGAL_EMAIL_PROVIDER:-}
    VITE_LEGAL_JURISDICTION: ${VITE_LEGAL_JURISDICTION:-}
    VITE_ALLOW_PLACEHOLDER_LEGAL: ${VITE_ALLOW_PLACEHOLDER_LEGAL:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enregla
      POSTGRES_USER: enregla
    # Claves de la base de datos (POSTGRES_PASSWORD y las de los roles) en un fichero que SOLO recibe
    # este servicio (deploy/generate-db-secrets.sh lo crea). El script de inicio crea enregla_owner
    # (migraciones y mantenimiento), enregla_app (ejecución) y enregla_backup (copias, solo lectura).
    env_file:
      - path: deploy/secrets/db.env
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha por socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U enregla -d enregla"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo accesible desde la red interna de compose.

  # Migraciones con el rol PROPIETARIO del esquema, en un paso aparte que termina antes de que
  # arranque la app. Al acabar fija los permisos del rol de la app (APP_DB_ROLE): en `records`
  # solo SELECT e INSERT, así que ni la app ni quien robe sus credenciales pueden reescribir,
  # borrar ni desactivar el trigger de inmutabilidad del historial.
  migrate:
    build: *app-build
    image: enregla-app:local
    restart: "no"
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGUSER: enregla_owner
      PGDATABASE: enregla
      APP_DB_ROLE: enregla_app
    # Solo la clave del propietario (PGPASSWORD de deploy/secrets/owner.env), nada más.
    env_file:
      - path: deploy/secrets/owner.env
        required: true
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Mantenimiento cada hora con el rol PROPIETARIO (N1/N3): purga los locales cuyo plazo venció o cuya
  # eliminación inmediata pidió su titular (como mucho en una hora) y la auditoría antigua (mínimo
  # 12 meses, fijado en la base de datos). La app NO puede ejecutar estas purgas. Si en 24 h se
  # fueran a purgar más locales de los permitidos (enregla_owner_settings.max_purges_per_day, 3 por
  # defecto), no purga ninguno, lo registra en la auditoría y escribe un error en su log.
  maintenance:
    build: *app-build
    image: enregla-app:local
    restart: unless-stopped
    command: ["node", "dist/scripts/maintenance.js", "--loop", "3600"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGUSER: enregla_owner
      PGDATABASE: enregla
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-12}
    env_file:
      - path: deploy/secrets/owner.env
        required: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true

  app:
    build: *app-build
    image: enregla-app:local
    restart: unless-stopped
    # La app NO recibe las claves de administración ni del propietario: solo server/.env (sin claves
    # de la base de datos) y deploy/secrets/app-db.env (PGPASSWORD del rol enregla_app). En producción
    # se niega a arrancar si encuentra POSTGRES_PASSWORD o DB_*_PASSWORD en su entorno.
    env_file:
      - path: server/.env
        required: true
      - path: deploy/secrets/app-db.env
        required: true
    environment:
      # Siempre production (aunque server/.env diga development): la imagen no trae pino-pretty.
      NODE_ENV: production
      # Conexión por variables separadas: la contraseña NO va dentro de una URL (no hace falta
      # codificar caracteres como @ : / #). DATABASE_URL vacío anula el que haya en server/.env.
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      # Rol de EJECUCIÓN: sin DDL, sin ser propietario de nada y, en `records`, solo SELECT e
      # INSERT. Las migraciones las aplica el servicio `migrate` con el rol propietario.
      PGUSER: enregla_app
      PGDATABASE: enregla
      MIGRATE_ON_START: "false"
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Solo en la interfaz local: el acceso público debe pasar por un proxy inverso con TLS
    # (ver docker-compose.prod.yml con Caddy). Publicarlo en todas las interfaces permitiría
    # saltarse el proxy y falsificar la IP con X-Forwarded-For.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  pgdata:
